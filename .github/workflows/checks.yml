name: Application checks
on:
  pull_request:
  push:
    branches: [development, main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --check server.mjs && node --check features.mjs && node --check app.js && node --check features-ui.js
      - run: node --test
      - run: docker build -t weallcreate:test .
