name: Application checks
on:
  pull_request:
  push:
    branches: [development, main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - run: node --check server.mjs && node --check features.mjs && node --check app.js && node --check features-ui.js
      - run: node --test
      - run: docker build -t weallcreate:test .
      - run: docker run -d --name weallcreate-smoke -p 127.0.0.1:3000:3000 -e APP_ORIGIN=https://weallcreate.example --mount type=volume,source=weallcreate-smoke-${{ github.run_id }},target=/app/data weallcreate:test
      - run: node ci-smoke.mjs
      - if: always()
        run: docker rm -f weallcreate-smoke || true
