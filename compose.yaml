services:
  web:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_PATH: /app/data/weallcreate.sqlite
      PORT: 3000
      APP_ORIGIN: https://${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
      TRUST_PROXY: caddy
    volumes:
      - weallcreate-data:/app/data
  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?Set SITE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
volumes:
  weallcreate-data:
  caddy-data:
  caddy-config:
