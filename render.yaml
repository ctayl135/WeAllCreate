# Creates paid resources only after the owner approves and applies this Blueprint.
services:
  - type: web
    name: weallcreate
    runtime: docker
    repo: https://github.com/ctayl135/WeAllCreate
    branch: development
    plan: starter
    region: virginia
    numInstances: 1
    autoDeployTrigger: off
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: weallcreate-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DATABASE_PATH
        value: /app/data/weallcreate.sqlite
      - key: TRUST_PROXY
        value: render
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PRICE_ID
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: STRIPE_CONNECT_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        sync: false
      - key: ADMIN_EMAILS
        sync: false
      - key: SUPPORT_EMAIL
        sync: false
      - key: BACKUP_ENCRYPTION_KEY
        sync: false
